<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FF6F61" />
    <meta
      name="description"
      content="Browse verified rooms near campus and work. Free for renters. Stripe-verified hosts, RTA-compliant agreements, direct payouts."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quni Living" />
    <meta property="og:title" content="Quni Living - verified accommodation near campus & work" />
    <meta
      property="og:description"
      content="Browse verified rooms near campus and work. Free for renters. Stripe-verified hosts, RTA-compliant agreements, direct payouts."
    />
    <meta property="og:url" content="https://quni.com.au" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:image" content="https://quni.com.au/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Quni - verified accommodation near campus and work" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://quni.com.au/og-default.png" />
    <meta name="twitter:title" content="Quni Living - verified accommodation near campus & work" />
    <meta
      name="twitter:description"
      content="Browse verified rooms near campus and work. Free for renters. Stripe-verified hosts, RTA-compliant agreements, direct payouts."
    />
    <!-- Featured / lazy collage images may still hit Unsplash. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- Homepage LCP: first-party AVIF. Default href matches common mobile pick (640w). -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/hero/hero-top-640.avif"
      imagesrcset="/hero/hero-top-480.avif 480w, /hero/hero-top-640.avif 640w, /hero/hero-top-800.avif 800w"
      imagesizes="(min-width: 1024px) 36vw, 75vw"
      fetchpriority="high"
    />
    <!-- Self-hosted fonts (see src/styles/fonts.css). Preload hero + body faces. -->
    <link
      rel="preload"
      href="/fonts/playfair-display-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Mobile LCP is the Inter hero lead paragraph (not Playfair). Declare @font-face here so
      the preloaded Inter woff2 can apply before the main CSS bundle arrives.
    -->
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/inter-latin-400-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Mobile LCP candidate — keep paintable before the main CSS bundle. */
      .home-hero-lead {
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.9);
        font-size: 1rem;
        line-height: 1.625;
        margin: 0 0 2rem;
        max-width: 36rem;
      }
      @media (min-width: 640px) {
        .home-hero-lead {
          font-size: 1.125rem;
        }
      }
    </style>
    <title>Quni Living - verified accommodation near campus & work</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

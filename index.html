<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FF6F61" />
    <meta
      name="description"
      content="Browse verified rooms near campus and work. Free for renters. Stripe-verified hosts, RTA-compliant agreements, direct payouts."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quni Living" />
    <meta property="og:title" content="Quni Living - verified accommodation near campus & work" />
    <meta
      property="og:description"
      content="Browse verified rooms near campus and work. Free for renters. Stripe-verified hosts, RTA-compliant agreements, direct payouts."
    />
    <meta property="og:url" content="https://quni.com.au" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:image" content="https://quni.com.au/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Quni - verified accommodation near campus and work" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://quni.com.au/og-default.png" />
    <meta name="twitter:title" content="Quni Living - verified accommodation near campus & work" />
    <meta
      name="twitter:description"
      content="Browse verified rooms near campus and work. Free for renters. Stripe-verified hosts, RTA-compliant agreements, direct payouts."
    />
    <!-- Featured / lazy collage images may still hit Unsplash. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!--
      Mobile LCP is the hero headline (collage is below the fold). Preload the image only on
      desktop so it does not contend with CSS + Playfair on slow mobile.
    -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(min-width: 1024px)"
      href="/hero/hero-top-800.avif"
      imagesrcset="/hero/hero-top-480.avif 480w, /hero/hero-top-640.avif 640w, /hero/hero-top-800.avif 800w"
      imagesizes="(min-width: 1024px) 36vw, 75vw"
      fetchpriority="high"
    />
    <!-- Declare @font-face early so the preloaded woff2 can paint the LCP headline. -->
    <link
      rel="preload"
      href="/fonts/playfair-display-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Playfair Display';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/playfair-display-latin-700-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Critical above-the-fold homepage hero (full styles still come from the app CSS). */
      .home-hero {
        background-color: #ff6f61;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }
      .home-hero h1 {
        font-family: 'Playfair Display', Georgia, 'Iowan Old Style', serif;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.025em;
        line-height: 1.25;
        font-size: 3rem;
        margin: 0 0 2rem;
      }
      @media (min-width: 640px) {
        .home-hero h1 {
          font-size: 3.75rem;
          margin-bottom: 2.5rem;
        }
      }
      @media (min-width: 1024px) {
        .home-hero h1 {
          font-size: 4.5rem;
        }
      }
    </style>
    <title>Quni Living - verified accommodation near campus & work</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
